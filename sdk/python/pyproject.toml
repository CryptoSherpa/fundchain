[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundchain"
version = "0.1.0"
description = "Python SDK for the FundChain crowdfunding REST + x402 gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FundChain" }]
keywords = ["fundchain", "x402", "crowdfunding", "ethereum", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Zero runtime deps — uses urllib from the stdlib so this installs cleanly
# into any 3.9+ environment without dragging in requests/httpx.
dependencies = []

[project.urls]
Homepage = "https://fundchain.vercel.app"
Documentation = "https://fundchain.vercel.app/docs"
Source = "https://github.com/CryptoSherpa/fundchain"

[tool.setuptools.packages.find]
where = ["."]
include = ["fundchain*"]
